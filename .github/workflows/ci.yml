name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    # The plugin's manifest is Windows only, so its tests run on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # A broken workflow file otherwise only shows up when it is next needed,
      # with no job and no log to explain it.
      - name: workflows parse
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import glob, sys, yaml
          bad = False
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  yaml.safe_load(open(path))
                  print(f"{path}: ok")
              except Exception as exc:
                  print(f"{path}: {exc}", file=sys.stderr)
                  bad = True
          sys.exit(1 if bad else 0)
          PY

      - run: go vet ./...
      - run: go test ./...

      # The manifest's build command is what `herdr plugin install` runs, so a
      # break there is a broken install even when the tests pass.
      - name: build as the plugin manifest does
        shell: cmd
        run: go build -trimpath -o bin\ekanban.exe .\cmd\ekanban

      # Not shipped for Linux or macOS yet, but the code keeps compiling there,
      # so adding those platforms stays a manifest change.
      - name: still compiles for Linux and macOS
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=linux go vet ./...
