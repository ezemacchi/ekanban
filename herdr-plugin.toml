id = "ekanban"
name = "eKanban"
version = "0.5.0"
min_herdr_version = "0.7.5"
description = "A status board over your spaces: todo, in progress, waiting on someone, done - plus any status you invent."
# Windows fork: every command goes through cmd.exe instead of sh, which Herdr
# on Windows does not have. cmd expands %HERDR_PLUGIN_ROOT% the way sh -c
# expanded $HERDR_PLUGIN_ROOT upstream.
platforms = ["windows"]

[[build]]
command = ["cmd", "/c", "go build -trimpath -o bin\\ekanban.exe .\\cmd\\ekanban"]

[[actions]]
id = "open"
title = "Open eKanban"
contexts = ["global", "workspace"]
command = ["cmd", "/c", "%HERDR_BIN_PATH%", "plugin", "pane", "open", "--plugin", "%HERDR_PLUGIN_ID%", "--entrypoint", "board"]

[[panes]]
id = "board"
title = "Board"
placement = "popup"
width = "80%"
height = "85%"
command = ["cmd", "/c", "%HERDR_PLUGIN_ROOT%\\bin\\ekanban.exe"]

[[actions]]
id = "dock"
title = "Dock eKanban to the right"
contexts = ["global", "workspace"]
command = ["cmd", "/c", "%HERDR_BIN_PATH%", "plugin", "pane", "open", "--plugin", "%HERDR_PLUGIN_ID%", "--entrypoint", "side", "--placement", "split", "--direction", "right"]

[[panes]]
id = "side"
title = "Board"
placement = "split"
command = ["cmd", "/c", "%HERDR_PLUGIN_ROOT%\\bin\\ekanban.exe", "sidebar"]

# The board as a tab of its own, which stays open when a card sends you to its
# workspace or agent (a popup or a dock closes then). Open it with --cwd set to
# a repository to get that repository's tickets.
[[panes]]
id = "tab"
title = "Board"
placement = "tab"
command = ["cmd", "/c", "%HERDR_PLUGIN_ROOT%\\bin\\ekanban.exe", "tab"]

# One team run as a kanban of its roles. Open it as a tab with --cwd set to
# the run's worktree; it reads the run there ([run] in config.toml says where).
[[panes]]
id = "ticket"
title = "Ticket"
placement = "tab"
command = ["cmd", "/c", "%HERDR_PLUGIN_ROOT%\\bin\\ekanban.exe", "ticket"]

[[startup]]
command = ["cmd", "/c", "%HERDR_PLUGIN_ROOT%\\bin\\ekanban.exe", "startup"]

[[events]]
on = "workspace.created"
command = ["cmd", "/c", "%HERDR_PLUGIN_ROOT%\\bin\\ekanban.exe", "sync"]
