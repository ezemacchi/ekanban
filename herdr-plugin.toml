id = "phin-board"
name = "Phin Board"
version = "0.5.0"
min_herdr_version = "0.7.5"
description = "A status board over your spaces: todo, in progress, waiting on someone, done - plus any status you invent."
# Windows fork: every command goes through cmd.exe instead of sh, which Herdr
# on Windows does not have. cmd expands %HERDR_PLUGIN_ROOT% the way sh -c
# expanded $HERDR_PLUGIN_ROOT upstream.
platforms = ["windows"]

[[build]]
command = ["cmd", "/c", "go build -trimpath -o bin\\herdr-phin-board.exe .\\cmd\\herdr-phin-board"]

[[actions]]
id = "open"
title = "Open Phin Board"
contexts = ["global", "workspace"]
command = ["cmd", "/c", "%HERDR_BIN_PATH%", "plugin", "pane", "open", "--plugin", "%HERDR_PLUGIN_ID%", "--entrypoint", "phin-board"]

[[panes]]
id = "phin-board"
title = "Board"
placement = "popup"
width = "80%"
height = "85%"
command = ["cmd", "/c", "%HERDR_PLUGIN_ROOT%\\bin\\herdr-phin-board.exe"]

[[actions]]
id = "dock"
title = "Dock Phin Board to the right"
contexts = ["global", "workspace"]
command = ["cmd", "/c", "%HERDR_BIN_PATH%", "plugin", "pane", "open", "--plugin", "%HERDR_PLUGIN_ID%", "--entrypoint", "side", "--placement", "split", "--direction", "right"]

[[panes]]
id = "side"
title = "Board"
placement = "split"
command = ["cmd", "/c", "%HERDR_PLUGIN_ROOT%\\bin\\herdr-phin-board.exe", "sidebar"]

[[startup]]
command = ["cmd", "/c", "%HERDR_PLUGIN_ROOT%\\bin\\herdr-phin-board.exe", "startup"]

[[events]]
on = "workspace.created"
command = ["cmd", "/c", "%HERDR_PLUGIN_ROOT%\\bin\\herdr-phin-board.exe", "sync"]
